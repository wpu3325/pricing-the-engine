name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - name: Unit, parity, acceptance, fuzz, syntax
        run: node scripts/verify.mjs
      - name: Deliverables reproducible from the engine and the workbook
        run: |
          python3 scripts/extract_workbook.py
          node scripts/build.mjs
          node scripts/build_deliverables.mjs
          git diff --exit-code index.html app deliverables data/workbook_dump.json
  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
